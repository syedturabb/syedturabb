name: Daily README Update

on:
  schedule:
    - cron: "0 6 * * *" # runs daily
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI SDK
        run: pip install openai

      - name: Run AI update script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_readme.py

      - name: Commit changes
        run: |
          git config user.name "ai-readme-bot"
          git config user.email "ai-readme-bot@users.noreply.github.com"
          git add README.md
          git commit -m "🤖 Daily README update" || exit 0
          git push
